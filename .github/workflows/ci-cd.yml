
name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run automated tests
      - name: Run Pytest
        run: |
          python -m pytest -v

      # 5. Define lowercase image name
      - name: Set Image Name
        id: meta
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      # 6. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      # 7. Scan Docker image
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"


      # 8. Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      # 9. Push Docker image
      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      # 10. Prepare EC2 deployment directory
      - name: Prepare EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            mkdir -p /home/ubuntu/cicd-demo

      # 11. Copy Compose configuration to EC2
      - name: Copy Deployment Configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/cicd-demo/"

      # 12. Deploy application on EC2
      - name: Deploy to AWS EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ steps.meta.outputs.image_name }}:${{ github.sha }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            cd /home/ubuntu/cicd-demo

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            echo "IMAGE=$IMAGE" > .env

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans

            sudo docker image prune -f

            sudo docker compose ps
